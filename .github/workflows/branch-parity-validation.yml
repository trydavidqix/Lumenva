name: Branch parity validation

on:
  push:
    branches: [implementation/unified]
    paths-ignore:
      # Keep this workflow unignored so source-run report-only commits can dispatch it.
      - .github/workflows/branch-parity-report.yml
      - BRANCH_CONSOLIDATION_REPORT.md
      - IMPLEMENTATION_PLAN.md
      - docs/audits/**
      - tooling/scripts/compare-branch-validation.mjs
      - tooling/scripts/repo-check.mjs
      - tooling/scripts/run-branch-validation.mjs
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    name: Pin comparison commits
    runs-on: windows-2025
    outputs:
      main_sha: ${{ steps.refs.outputs.main_sha }}
      unified_sha: ${{ steps.refs.outputs.unified_sha }}
      source_run_id: ${{ steps.refs.outputs.source_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Resolve immutable comparison refs
        id: refs
        shell: pwsh
        run: |
          git fetch origin main
          "main_sha=$(git rev-parse FETCH_HEAD)" >> $env:GITHUB_OUTPUT
          "unified_sha=${{ github.sha }}" >> $env:GITHUB_OUTPUT
          $sourceRunId = $env:GITHUB_RUN_ID
          if ($env:COMMIT_MESSAGE -match 'ci\(parity-report\): source-run=(\d+)') {
            $sourceRunId = $Matches[1]
          }
          "source_run_id=$sourceRunId" >> $env:GITHUB_OUTPUT
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

  validate:
    name: ${{ matrix.suite }} — main vs unified
    if: "${{ !startsWith(github.event.head_commit.message || '', 'ci(parity-report): source-run=') }}"
    needs: [prepare]
    runs-on: windows-2025
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, typecheck, lint, build, toolchain]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.unified_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Fetch current main for isolated comparison
        run: git fetch origin main

      - name: Run the selected suite on main and unified
        env:
          MAIN_REF: ${{ needs.prepare.outputs.main_sha }}
        run: node tooling/scripts/run-branch-validation.mjs --suite=${{ matrix.suite }}
        continue-on-error: true

      - name: Enforce unified repository policy
        if: always()
        run: pnpm repo:check

      - name: Upload raw logs and summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-parity-${{ matrix.suite }}
          path: parity-artifacts/
          if-no-files-found: error
          retention-days: 30

  compare:
    name: Compare and classify results
    if: always()
    needs: [prepare, validate]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.unified_sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Download all validation artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: branch-parity-*
          path: parity-artifacts/
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Create comparison report
        run: node tooling/scripts/compare-branch-validation.mjs

      - name: Upload comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-parity-comparison
          path: |
            parity-artifacts/comparison.md
            parity-artifacts/comparison.json
          if-no-files-found: error
          retention-days: 30
