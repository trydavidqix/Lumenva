name: voice-local-inline-ci

on:
  push:
    branches:
      - feat/voice-personality-patter-inline
  workflow_dispatch:

jobs:
  verify-voice-local:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Install voice worker dependencies
        run: npm install
        working-directory: workers/voice-worker

      - name: Voice worker checks
        run: npm run check
        working-directory: workers/voice-worker

      - name: CRM typecheck
        run: pnpm --dir apps/crm typecheck

      - name: CRM unit tests
        run: pnpm --dir apps/crm test:unit

      - name: Voice core verification
        run: bash scripts/verify-voice-core.sh
        working-directory: apps/crm
