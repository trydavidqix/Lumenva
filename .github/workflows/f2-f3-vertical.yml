name: f2-f3-vertical
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
jobs:
  vertical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm repo:check
      - run: pnpm --filter lumenva-crm lint
      - run: pnpm --filter lumenva-crm typecheck
      - run: pnpm --filter lumenva-crm test:f2-f3
