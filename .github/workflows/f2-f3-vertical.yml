name: f2-f3-vertical
on:
  pull_request:
  push:
    branches: [main]
jobs:
  vertical:
    runs-on: [self-hosted, self-hosted-lumenva-disposable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter lumenva-crm lint
      - run: pnpm --filter lumenva-crm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: pnpm --filter lumenva-crm test:f2-f3
