name: native-public-e2e

# Browser E2E without a container daemon, external service keys, or access to
# production. This is the public website suite, NOT authenticated CRM E2E.
on:
  push:
    branches: [chore/lumenva-toolchain-canonicalization]
    paths:
      - 'apps/website/**'
      - '.github/workflows/e2e.yml'
      - 'apps/crm/tests/unit/e2e-workflow-honra-o-env.test.ts'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-public-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-website:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      NEXT_PUBLIC_SITE_URL: https://lumenva-ci.invalid
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: Canonical repository gate
        run: pnpm repo:check
      - name: Install Playwright Chromium directly on runner
        run: pnpm --dir apps/website exec playwright install --with-deps chromium
      - name: Run public website browser E2E
        run: pnpm --dir apps/website run test:e2e
      - name: Attach browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-playwright-results
          path: |
            apps/website/test-results/
            apps/website/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
