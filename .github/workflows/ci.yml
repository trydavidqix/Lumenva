name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Invariante 1 de docs/doctrine/restricao-de-canal.md: nenhuma feature
      # nomeia um provider. Step próprio (e não só dentro de `gov:verify`)
      # porque é o CI que gateia PR — `gov:verify` não é invocado por nenhum
      # workflow, e mecanismo que não roda no gate não protege nada.
      - name: Channel provider leak
        run: pnpm lint:channels

      # O harness é multi-superfície (CLAUDE.md, AGENTS.md, skills Claude/Codex,
      # rules e artefatos ECC). Este gate impede regressões de instruções antigas
      # e garante que a doutrina modular continua versionável e apontando para a
      # mesma fonte canônica.
      - name: Harness consistency
        run: pnpm test:harness && pnpm harness:check

      - name: Agent governance harness
        run: pnpm test:governance

      - name: Unit tests
        run: pnpm test:unit

      # Scripts do kit self-host num repo git descartável (docker/crontab
      # dublados). É o único gate que exercita o update.sh — um erro aqui
      # rebobina a instalação de quem hospeda, e nenhum teste TS o veria.
      - name: Kit self-host (bash)
        run: pnpm test:shell

  # Gate de isolamento multi-tenant + invariantes de governança.
  # Job separado de propósito: roda em paralelo ao verify (não atrasa o feedback
  # rápido) e vira um check nomeado, que é o que a doutrina de RLS exige provar.
  # apps/crm/scripts/test-db.sh sobe pgvector/pgvector:pg17, aplica infra/supabase/baseline.sql
  # em modo install (ON_ERROR_STOP=1) e update (idempotência), e roda
  # tests/invariants/** contra ele. Invocar via `pnpm test:db` é o que põe
  # node_modules/.bin no PATH que o script herda para chamar `vitest`.
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: RLS isolation + governance invariants
        run: pnpm test:db

  # An evidence artifact binds both canonical CI jobs to the exact PR head SHA.
  # The workflow check remains required; the artifact makes the SHA auditable.
  governance-evidence:
    if: always()
    needs: [verify, invariants]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Write exact-head evidence
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ACTIONS_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          INVARIANTS_RESULT: ${{ needs.invariants.result }}
        run: node tooling/agent-governance/write-actions-evidence.mjs
      - name: Upload governance evidence
        uses: actions/upload-artifact@v4
        with:
          name: governance-evidence-${{ github.run_id }}
          path: artifacts/governance/actions-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Require all canonical checks
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          INVARIANTS_RESULT: ${{ needs.invariants.result }}
        run: node tooling/agent-governance/write-actions-evidence.mjs --assert-pass
