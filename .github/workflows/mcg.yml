name: MCG gates

on:
  workflow_dispatch:
  push:
    branches: [lumenva-command-center]
    paths:
      - 'packages/maestri-context-gateway/**'
      - 'docs/LUMENVA_COMMAND_CENTER_PLAN.md'
      - 'docs/superpowers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcg.yml'
  pull_request:
    paths:
      - 'packages/maestri-context-gateway/**'
      - 'docs/LUMENVA_COMMAND_CENTER_PLAN.md'
      - 'docs/superpowers/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcg.yml'

jobs:
  mcg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: MCG unit tests
        run: pnpm --filter @lumenva/maestri-context-gateway test:unit
      - name: Import and syntax smoke
        run: pnpm --filter @lumenva/maestri-context-gateway check:syntax
      - name: Secret, path and personal-data scan
        run: pnpm --filter @lumenva/maestri-context-gateway scan:sensitive
      - name: Dashboard smoke
        run: pnpm --filter @lumenva/maestri-context-gateway smoke:dashboard
      - name: Contracts smoke
        run: pnpm --filter @lumenva/maestri-context-gateway smoke:contracts
