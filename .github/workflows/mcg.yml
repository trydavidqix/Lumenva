name: Maestri V3 MCG integration

on:
  workflow_dispatch:
  push:
    branches: [vps]
    paths:
      - 'apps/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcg.yml'
  pull_request:
    paths:
      - 'apps/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/mcg.yml'

jobs:
  mcg-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Core and standalone MCG integration tests
        run: pnpm --filter @lumenva/core test
      - name: Core typecheck
        run: pnpm --filter @lumenva/core typecheck
