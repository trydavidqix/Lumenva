name: toolchain-canonicalization
on:
  push:
    branches: [chore/lumenva-toolchain-canonicalization]
concurrency:
  group: toolchain-canonicalization
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[canonicalized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/lumenva-toolchain-canonicalization
          fetch-depth: 0
      - name: Apply canonical toolchain
        run: node tooling/scripts/canonicalize-toolchain.mjs
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - name: Regenerate lockfile and add audit tools
        run: pnpm install --no-frozen-lockfile
      - name: Validate core gates
        run: |
          pnpm install --frozen-lockfile
          pnpm repo:check
          pnpm typecheck
          pnpm lint
          pnpm test:unit
      - name: Commit validated wave
        if: success()
        run: |
          git config user.name "lumenva-toolchain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: modernize canonical toolchain [canonicalized]"
          git push origin HEAD:chore/lumenva-toolchain-canonicalization
