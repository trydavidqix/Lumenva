name: toolchain-validation
on:
  push:
    branches: [chore/lumenva-toolchain-canonicalization]
concurrency:
  group: toolchain-validation-v2
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[knip-report]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diagnose CRM workspace link at checkout
        run: |
          git ls-files -s apps/crm/supabase
          ls -ld apps/crm/supabase infra/supabase || true
          readlink apps/crm/supabase || true
          test -L apps/crm/supabase
          test -d apps/crm/supabase
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v6
      - name: Resolve canonical lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Validate frozen install
        run: pnpm install --frozen-lockfile
      - name: Verify CRM workspace link after install
        run: |
          git ls-files -s apps/crm/supabase
          ls -ld apps/crm/supabase infra/supabase || true
          readlink apps/crm/supabase || true
          test -L apps/crm/supabase
          test -d apps/crm/supabase
      - name: Validate dependency versions
        run: pnpm check:versions
      - name: Validate monorepo structure
        run: pnpm check:monorepo
      - name: Validate repository invariants
        run: pnpm repo:check
      - name: Dead-code audit
        run: |
          set +e
          pnpm check:dead-code 2>&1 | tee .knip-report.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name "lumenva-toolchain-bot"
            git config user.email "actions@users.noreply.github.com"
            git add .knip-report.txt
            if ! git diff --cached --quiet; then
              git commit -m "chore: capture Knip report [knip-report]"
              git push origin HEAD:chore/lumenva-toolchain-canonicalization
            fi
            exit "$status"
          fi
          rm -f .knip-report.txt
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Build all buildable workspaces
        env:
          NEXT_PUBLIC_SITE_URL: https://lumenva-ci.invalid
        run: pnpm -r --workspace-concurrency=1 --if-present run build
      - name: CRM Next config regression
        run: node apps/crm/node_modules/vitest/vitest.mjs run --config apps/crm/vitest.config.ts apps/crm/tests/unit/next-config-output.test.ts
      - name: Native voice worker tests
        run: pnpm --dir apps/voice-worker run check
      - name: Unit tests
        run: pnpm test:unit
      - name: Persist validated lockfile
        if: success()
        run: |
          git config user.name "lumenva-toolchain-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already canonical."
            exit 0
          fi
          git diff --cached --check
          git commit -m "chore: refresh canonical lockfile [validated]"
          git push origin HEAD:chore/lumenva-toolchain-canonicalization
