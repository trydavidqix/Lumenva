name: native-release-dry-run

# Historical image-publishing action retired. This gate only checks packaging
# into a native Node.js tarball; it never signs into a registry or deploys.
on:
  push:
    branches: [chore/lumenva-toolchain-canonicalization]
    paths:
      - 'apps/crm/**'
      - 'tooling/scripts/package-native-crm.sh'
      - 'tooling/scripts/native-release.mjs'
      - '.github/workflows/publish-image.yml'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Repository gate
        run: pnpm repo:check
      - name: Native CRM standalone package
        env:
          NEXT_PUBLIC_SITE_URL: https://lumenva-ci.invalid
          SENTRY_DSN: 'off'
        run: bash tooling/scripts/package-native-crm.sh
      - name: Native release activation, server smoke and rollback
        env:
          NATIVE_RELEASE_ROOT: ${{ runner.temp }}/lumenva-release-simulation
        run: |
          NATIVE_RELEASE_VERSION=baseline node tooling/scripts/native-release.mjs stage "$NATIVE_RELEASE_ROOT" "${RUNNER_TEMP}/lumenva-native-crm.tar.gz"
          node tooling/scripts/native-release.mjs activate "$NATIVE_RELEASE_ROOT" baseline
          node tooling/scripts/native-release.mjs smoke "$NATIVE_RELEASE_ROOT"
          NATIVE_RELEASE_VERSION=candidate node tooling/scripts/native-release.mjs stage "$NATIVE_RELEASE_ROOT" "${RUNNER_TEMP}/lumenva-native-crm.tar.gz"
          node tooling/scripts/native-release.mjs activate "$NATIVE_RELEASE_ROOT" candidate
          node tooling/scripts/native-release.mjs smoke "$NATIVE_RELEASE_ROOT"
          node tooling/scripts/native-release.mjs rollback "$NATIVE_RELEASE_ROOT"
          node tooling/scripts/native-release.mjs smoke "$NATIVE_RELEASE_ROOT"
          test "$(node tooling/scripts/native-release.mjs status "$NATIVE_RELEASE_ROOT")" = '{"active":"baseline","previous":"candidate"}'
      - name: Upload test artifact (not a production deployment)
        uses: actions/upload-artifact@v4
        with:
          name: native-crm-dry-run
          path: ${{ runner.temp }}/lumenva-native-crm.tar.gz
          if-no-files-found: error
          retention-days: 3
