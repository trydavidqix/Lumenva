name: Publicar imagem Docker (Artifact Registry)

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch: {}

env:
  REGISTRY: us-east1-docker.pkg.dev
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Google WIF
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Autenticar via Google WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/PLACEHOLDER/locations/global/workloadIdentityPools/github/providers/github-provider"
          service_account: "ci-publisher@placeholder-project.iam.gserviceaccount.com"
          token_format: "access_token"

      - name: Log in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: "oauth2accesstoken"
          password: ${{ steps.auth.outputs.access_token }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/PLACEHOLDER_PROJECT/placeholder-repo/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push (dry-run para F8-C0)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: false # F8-C0 exige dry-run, sem push de imagem real
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
