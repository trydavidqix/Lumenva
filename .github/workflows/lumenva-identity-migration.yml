name: Lumenva identity migration

on:
  push:
    branches:
      - refactor/lumenva-identity-purge-2026-09-14
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[identity-purge-complete]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/lumenva-identity-purge-2026-09-14
          fetch-depth: 0

      - name: Transform repository identity
        shell: bash
        run: |
          python3 - <<'PY'
          from __future__ import annotations
          import os
          import re
          import subprocess
          from pathlib import Path

          def run(*args: str) -> str:
              return subprocess.check_output(args, text=True).strip()

          explicit = [
              ("https://github.com/melgarafael/DeskcommCRM", "https://github.com/trydavidqix/Lumenva"),
              ("github.com/melgarafael/DeskcommCRM", "github.com/trydavidqix/Lumenva"),
              ("melgarafael/DeskcommCRM", "trydavidqix/Lumenva"),
              ("https://ghcr.io/melgarafael/deskcommcrm", "https://ghcr.io/trydavidqix/lumenva"),
              ("ghcr.io/melgarafael/deskcommcrm", "ghcr.io/trydavidqix/lumenva"),
              ("melgarafael/deskcommcrm", "trydavidqix/lumenva"),
              ("support@deskcomm.com.br", "contato@lumenva.pt"),
              ("suporte@deskcomm.app", "contato@lumenva.pt"),
              ("contato@deskcomm.com.br", "contato@lumenva.pt"),
              ("ops@deskcomm.com.br", "ops@lumenva.pt"),
              ("demo@deskcomm.com.br", "demo@lumenva.pt"),
              ("operador@deskcomm.com.br", "operador@lumenva.pt"),
              ("crm.deskcomm.com.br", "crm.lumenva.pt"),
              ("app.deskcomm.com.br", "crm.lumenva.pt"),
              ("app.deskcomm.com", "crm.lumenva.pt"),
              ("admin.deskcomm.com.br", "admin.lumenva.pt"),
              ("admin.deskcomm.com", "admin.lumenva.pt"),
              ("waha.deskcomm.com.br", "waha.lumenva.pt"),
              ("waha.deskcomm.com", "waha.lumenva.pt"),
              ("status.deskcomm.com.br", "status.lumenva.pt"),
              ("status.deskcomm.com", "status.lumenva.pt"),
              ("deskcomm.com.br", "lumenva.pt"),
              ("deskcomm.com", "lumenva.pt"),
              ("deskcomm.app", "lumenva.pt"),
              ("DeskcommCRM", "Lumenva"),
              ("DESKCOMMCRM", "LUMENVA"),
              ("deskcommcrm", "lumenva"),
              ("Deskcomm-CRM", "Lumenva-CRM"),
              ("DESKCOMM-CRM", "LUMENVA-CRM"),
              ("deskcomm-crm", "lumenva-crm"),
              ("DESKCOMM_", "LUMENVA_"),
          ]
          old_word = re.compile(r"deskcomm", re.IGNORECASE)

          def replace_word(match: re.Match[str]) -> str:
              value = match.group(0)
              if value.isupper():
                  return "LUMENVA"
              if value.islower():
                  return "lumenva"
              return "Lumenva"

          def transform(value: str) -> str:
              for old, new in explicit:
                  value = value.replace(old, new)
              return old_word.sub(replace_word, value)

          tracked = [p for p in run("git", "ls-files", "-z").split("\0") if p]
          moves: list[tuple[str, str]] = []
          new_to_old: dict[str, str] = {}
          for old in tracked:
              new = transform(old)
              if new != old:
                  if new in new_to_old and new_to_old[new] != old:
                      raise SystemExit(f"path collision: {old} and {new_to_old[new]} -> {new}")
                  if Path(new).exists() and new not in tracked:
                      raise SystemExit(f"target already exists: {new}")
                  new_to_old[new] = old
                  moves.append((old, new))

          for old, new in sorted(moves, key=lambda pair: pair[0].count('/'), reverse=True):
              Path(new).parent.mkdir(parents=True, exist_ok=True)
              subprocess.check_call(["git", "mv", old, new])

          tracked = [p for p in run("git", "ls-files", "-z").split("\0") if p]
          changed = 0
          skipped_binary = []
          for name in tracked:
              path = Path(name)
              if not path.exists() and not path.is_symlink():
                  continue
              if path.is_symlink():
                  target = os.readlink(path)
                  updated = transform(target)
                  if updated != target:
                      path.unlink()
                      os.symlink(updated, path)
                      changed += 1
                  continue
              try:
                  raw = path.read_bytes()
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  skipped_binary.append(name)
                  continue
              updated = transform(text)
              if updated != text:
                  path.write_text(updated, encoding="utf-8", newline="")
                  changed += 1

          gate = Path(".github/scripts/check-lumenva-identity.py")
          gate.parent.mkdir(parents=True, exist_ok=True)
          gate.write_text('''from __future__ import annotations\nimport os\nimport subprocess\nfrom pathlib import Path\nOLD = ("desk" + "comm").casefold()\npaths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\\0")\nviolations = []\nfor name in filter(None, paths):\n    if OLD in name.casefold():\n        violations.append(f"path:{name}")\n    p = Path(name)\n    if p.is_symlink():\n        try:\n            if OLD in os.readlink(p).casefold():\n                violations.append(f"symlink:{name}")\n        except OSError:\n            pass\n        continue\n    try:\n        text = p.read_bytes().decode("utf-8")\n    except (UnicodeDecodeError, FileNotFoundError):\n        continue\n    if OLD in text.casefold():\n        violations.append(f"content:{name}")\nif violations:\n    print("Forbidden legacy identity remains:")\n    print("\\n".join(violations))\n    raise SystemExit(1)\nprint("Lumenva identity gate: PASS")\n''', encoding="utf-8")

          print(f"renamed paths: {len(moves)}")
          print(f"rewritten text/symlink files: {changed}")
          print(f"binary files skipped: {len(skipped_binary)}")
          if skipped_binary:
              print("binary list:")
              print("\n".join(skipped_binary))
          PY

      - name: Remove migration workflow from final tree
        run: rm -f .github/workflows/lumenva-identity-migration.yml

      - name: Verify zero legacy identity in tracked tree
        run: python3 .github/scripts/check-lumenva-identity.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir apps/crm typecheck

      - name: Lint
        run: pnpm --dir apps/crm lint

      - name: Unit tests
        run: pnpm --dir apps/crm test:unit

      - name: Verify zero legacy identity again
        run: python3 .github/scripts/check-lumenva-identity.py

      - name: Commit migration result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 1
          fi
          git commit -m "refactor: complete Lumenva identity migration [identity-purge-complete]"
          git push origin HEAD:refactor/lumenva-identity-purge-2026-09-14
          git push origin :refs/heads/refactor/zero-deskcomm-to-lumenva-2026-09-14 || true
