name: GCP CI (F8)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify canonical toolchain
        run: pnpm repo:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

  # No image build / registry authentication. Production packaging belongs to
  # the independent native-release dry-run; no cloud credentials in validation.
  native-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm repo:check
      - name: Build native CRM artifact without publishing
        env:
          NEXT_PUBLIC_SITE_URL: https://lumenva-ci.invalid
          SENTRY_DSN: 'off'
        run: bash tooling/scripts/package-native-crm.sh

  # Gate de banco de dados, em job separado conforme a doutrina de testes original, adaptado para este CI.
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify canonical toolchain
        run: pnpm repo:check

      - name: Install native PostgreSQL 17 + pgvector
        run: bash tooling/scripts/setup-native-postgres17.sh

      - name: RLS isolation + governance invariants (native PostgreSQL)
        env:
          TEST_DB_ENGINE: native
        run: pnpm test:db
