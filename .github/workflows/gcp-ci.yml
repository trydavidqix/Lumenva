name: GCP CI (F8)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Requerido para Workload Identity Federation (OIDC)
  packages: write # Requerido se o publish for para GHCR, embora seja GCP focado, usamos Artifact Registry.

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      # Autenticação GCP via OIDC - SEM uso de chaves JSON de longo prazo
      # Só executa se as variáveis de ambiente existirem, evitando falhas em PRs de forks ou ambientes sem credenciais
      - name: Authenticate to Google Cloud (OIDC)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP Artifact Registry
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Fallback para ghcr.io se GCP_ARTIFACT_REGISTRY não estiver definido para evitar falha no workflow
          images: ${{ vars.GCP_ARTIFACT_REGISTRY || 'ghcr.io' }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Dry-run: Apenas faz o build, NÃO publica. A publicação real pertence ao H1 (manual owner).
      - name: Build and push (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false # Isto garante o dry-run, sem deploy ou publicação real
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Gate de banco de dados, em job separado conforme a doutrina de testes original, adaptado para este CI.
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: RLS isolation + governance invariants
        run: pnpm test:db
