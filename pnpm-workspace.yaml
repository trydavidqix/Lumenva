  '@playwright/test': ^1.62.1
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/react': ^16.3.2
  '@testing-library/user-event': ^14.6.3
  '@types/node': ^26.2.0
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@upstash/redis': ^1.38.2
  eslint: ^9.12.0
  eslint-config-next: ^16.3.0
  jsdom: ^30.0.1
  next: ^16.3.0
  react: ^19.2.8
  react-dom: ^19.2.8
  resend: ^6.18.1
  typescript: ^6.0.3
  vitest: ^4.1.10
  zod: ^4.4.3

overrides:
  postcss: ^8.5.26
  sharp: ^0.35.0

