# Stack local de dependências externas para o DeskcommCRM.
#
# Sobe apenas o WAHA (Plus / NOWEB) pra desenvolvimento. Postgres + Auth + Storage
# vêm do Supabase Cloud (ou supabase local CLI separadamente, conforme o time preferir).
#
# Uso:
#   1. Copie .env.example -> .env.local e preencha WAHA_API_KEY (plaintext)
#   2. Gere o hash: echo -n "$WAHA_API_KEY" | shasum -a 512 | awk '{print $1}'
#   3. Cole esse hash em WAHA_API_KEY abaixo (NÃO o plaintext)
#   4. docker compose up -d
#   5. Acesse http://localhost:3030/dashboard/ (UI do WAHA Plus)
#      (host port 3030 — :3000 fica reservado pra outros dev tools como Remotion)
#
# Em prod, WAHA roda em VPS dedicada (Hostgator) atrás de Nginx (proxy_buffering off
# pra SSE). docker-compose aqui é DEV ONLY.

version: "3.9"

services:
  waha:
    image: devlikeapro/waha:noweb
    platform: linux/amd64
    container_name: deskcomm-waha
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      # Hash SHA512 hex da api key (NÃO plaintext). Cliente envia plaintext em X-Api-Key.
      WAHA_API_KEY: ${WAHA_API_KEY_SHA512}
      # Webhook base URL — precisa ser pública (use ngrok/cloudflared em dev).
      # host.docker.internal: o app Next roda no HOST em dev — localhost dentro do
      # container seria o próprio WAHA e o webhook nunca chegaria. Porta 3002:
      # a stack da fusão é isolada do checkout principal (3001 é do gov-loop).
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_BASE_URL:-http://host.docker.internal:3003}/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message,message.any,message.ack,session.status,state.change"
      # HMAC SHA512 do payload, validado server-side via crypto.timingSafeEqual.
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      # Engine NOWEB por default (mais leve, ~150MB; estável). O env é
      # WHATSAPP_DEFAULT_ENGINE — WAHA_DEFAULT_ENGINE NÃO existe no WAHA e caía
      # silenciosamente no default WEBJS (browser, trava a sessão).
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # Storage de mídia: Supabase Storage via Backend (NÃO inline base64).
      WAHA_DASHBOARD_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    healthcheck:
      # /ping é o único endpoint sem auth desta build (api/health = 401/404).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Worker 24/7 do agent-engine (fusão Vendaval): fila, cron/follow-up, drain do
  # event_log e turnos do agente rico. Postgres = Supabase (SUPABASE_DB_URL no
  # .env.local). Sobe junto do WAHA: `docker compose up -d`.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: deskcomm-agent-worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    environment:
      # dentro do container, localhost é o próprio worker — o WAHA está na rede
      # do compose (serviço waha, porta interna 3000). Sobrepõe o .env.local.
      WAHA_API_BASE_URL: http://waha:3000
    ports:
      - "8787:8787"
    healthcheck:
      # 127.0.0.1 explícito: localhost resolve p/ ::1 e o healthz escuta só IPv4.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Mantém o worker na rede padrão (WAHA) e adiciona as redes privadas opcionais
    # usadas pelos sidecars Mem0/Graphiti. Os profiles ai-memory/ai-graph continuam
    # desativados por padrão.
    networks:
      - default
      - ai-memory-internal
      - ai-graph-internal

  # Projeção semântica opcional. Nunca inicia com `docker compose up`: exige
  # explicitamente `--profile ai-memory` e só fica acessível pelo loopback no
  # host para o bootstrap local.
  mem0:
    # mem0/mem0-api-server:0.1.117 (o pin anterior) não existe mais no Docker
    # Hub, e a única tag publicada hoje (`latest`) só tem build ARM64 — não
    # roda nativo em x86_64. Build local a partir do source oficial; receita
    # completa e commit pinado em docs/runbooks/mem0.md.
    image: mem0-api-server:local
    profiles: ["ai-memory"]
    restart: unless-stopped
    environment:
      POSTGRES_HOST: mem0-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:?set MEM0_POSTGRES_PASSWORD in managed runtime secrets}
      JWT_SECRET: ${MEM0_JWT_SECRET:?set MEM0_JWT_SECRET in managed runtime secrets}
      OPENAI_API_KEY: ${MEM0_OPENAI_API_KEY:?set MEM0_OPENAI_API_KEY in managed runtime secrets}
    ports:
      - "127.0.0.1:${MEM0_DEV_PORT:-8888}:8000"
    depends_on:
      mem0-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    # `ai-memory-internal` alone (`internal: true`) blocks ALL routing off
    # that network, inbound AND outbound — the sidecar could reach
    # mem0-postgres but could never call out to its own configured LLM/
    # embedding provider (OpenAI/Gemini/whatever), confirmed by
    # `httpx.ConnectError: Temporary failure in name resolution` when trying.
    # `default` (the same network `worker` already joins for this same
    # reason) restores outbound egress without publishing any port — no host
    # port is opened by joining a network, only by `ports:` above, which
    # stays loopback-only in dev and absent entirely in prod.
    networks: [default, ai-memory-internal]

  # Banco exclusivo do Mem0; nunca aponta para Supabase nem para o schema CRM.
  mem0-postgres:
    image: pgvector/pgvector:pg16
    profiles: ["ai-memory"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:?set MEM0_POSTGRES_PASSWORD in managed runtime secrets}
    volumes:
      - mem0-postgres-data:/var/lib/postgresql/data
      - ./docker/mem0/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d mem0"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ai-memory-internal]

  # Projeção temporal/relacional opcional (Graphiti + FalkorDB, Fase 4). Nunca
  # inicia com `docker compose up`: exige `--profile ai-graph` explicitamente.
  # A feature (rollout mode) continua 'off' no CRM até decisão de promoção —
  # subir o sidecar não liga nada por si.
  #
  # NÃO VALIDADO: os nomes de env do container graphiti abaixo (FALKORDB_*,
  # OPENAI_API_KEY, MODEL_NAME, EMBEDDER_MODEL_NAME, SEMAPHORE_LIMIT, a porta
  # 8000 e o path /healthcheck) são o melhor palpite a partir da documentação
  # pública do graphiti-core/zepai — não foram confirmados contra a imagem
  # `zepai/graphiti:0.22.1` pinada (sem acesso a registry/execução real nesta
  # estação). A Task 4 do plano da Fase 4 inspeciona o OpenAPI publicado antes
  # de implementar o client; não habilite este profile fora de um teste
  # isolado até essa verificação.
  falkordb:
    image: falkordb/falkordb-server:v4.20.1-alpine
    profiles: ["ai-graph"]
    restart: unless-stopped
    environment:
      # Redis puro por baixo do módulo de grafo — sem senha, qualquer processo
      # na mesma rede docker autentica. REDIS_ARGS é a forma padrão de repassar
      # flags extra pro redis-server nas imagens da família redis-stack/FalkorDB.
      REDIS_ARGS: "--requirepass ${GRAPHITI_FALKORDB_PASSWORD:?set GRAPHITI_FALKORDB_PASSWORD in managed runtime secrets}"
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${GRAPHITI_FALKORDB_PASSWORD}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [ai-graph-internal]

  graphiti:
    image: zepai/graphiti:0.22.1
    profiles: ["ai-graph"]
    restart: unless-stopped
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_PASSWORD: ${GRAPHITI_FALKORDB_PASSWORD:?set GRAPHITI_FALKORDB_PASSWORD in managed runtime secrets}
      # Segredo compartilhado: o app envia o mesmo valor (GRAPHITI_API_KEY em
      # lib/env.ts) pra autenticar contra este serviço.
      GRAPHITI_API_KEY: ${GRAPHITI_API_KEY:?set GRAPHITI_API_KEY in managed runtime secrets}
      # Credencial de PLATAFORMA pro LLM/embedder do próprio sidecar Python —
      # nunca a BYOK de um tenant (ai_provider_credentials). Escopo isolado,
      # entregue via Infisical/runtime env conforme doc/runbook.
      OPENAI_API_KEY: ${GRAPHITI_LLM_API_KEY:?set GRAPHITI_LLM_API_KEY in managed runtime secrets}
      MODEL_NAME: ${GRAPHITI_LLM_MODEL:-gpt-4.1-mini}
      EMBEDDER_MODEL_NAME: ${GRAPHITI_EMBEDDER_MODEL:-text-embedding-3-small}
      # Cada episódio pode disparar várias chamadas de LLM (extração de
      # entidade + resolução de relação). Default baixo pra não estourar rate
      # limit/custo numa instalação self-host pequena.
      SEMAPHORE_LIMIT: ${GRAPHITI_INGESTION_CONCURRENCY:-2}
    depends_on:
      falkordb:
        condition: service_healthy
    # Loopback-only, só pra depuração local do adapter (Task 4). Produção não
    # publica porta nenhuma deste serviço (ver docker-compose.prod.yml).
    ports:
      - "127.0.0.1:${GRAPHITI_DEV_PORT:-8890}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthcheck', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    # ai-graph-internal sozinha (internal: true) bloqueia TODO roteamento pra
    # fora dessa rede, inclusive saída — o sidecar precisa alcançar o provider
    # de LLM/embedder configurado. `default` (a mesma rede que `worker` já usa
    # pelo mesmo motivo) restaura egress sem publicar porta nenhuma extra.
    networks: [default, ai-graph-internal]

volumes:
  waha-data:
  waha-media:
  mem0-postgres-data:
  falkordb-data:

networks:
  ai-memory-internal:
    internal: true
  ai-graph-internal:
    internal: true
