# Stack local de dependências externas para o DeskcommCRM.
#
# Sobe apenas o WAHA (Plus / NOWEB) pra desenvolvimento. Postgres + Auth + Storage
# vêm do Supabase Cloud (ou supabase local CLI separadamente, conforme o time preferir).
#
# Uso:
#   1. Copie .env.example -> .env.local e preencha WAHA_API_KEY (plaintext)
#   2. Gere o hash: echo -n "$WAHA_API_KEY" | shasum -a 512 | awk '{print $1}'
#   3. Cole esse hash em WAHA_API_KEY abaixo (NÃO o plaintext)
#   4. docker compose up -d
#   5. Acesse http://localhost:3030/dashboard/ (UI do WAHA Plus)
#      (host port 3030 — :3000 fica reservado pra outros dev tools como Remotion)
#
# Em prod, WAHA roda em VPS dedicada (Hostgator) atrás de Nginx (proxy_buffering off
# pra SSE). docker-compose aqui é DEV ONLY.

version: "3.9"

services:
  waha:
    image: devlikeapro/waha:noweb
    platform: linux/amd64
    container_name: deskcomm-waha
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      # Hash SHA512 hex da api key (NÃO plaintext). Cliente envia plaintext em X-Api-Key.
      WAHA_API_KEY: ${WAHA_API_KEY_SHA512}
      # Webhook base URL — precisa ser pública (use ngrok/cloudflared em dev).
      # host.docker.internal: o app Next roda no HOST em dev — localhost dentro do
      # container seria o próprio WAHA e o webhook nunca chegaria. Porta 3002:
      # a stack da fusão é isolada do checkout principal (3001 é do gov-loop).
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_BASE_URL:-http://host.docker.internal:3003}/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message,message.any,message.ack,session.status,state.change"
      # HMAC SHA512 do payload, validado server-side via crypto.timingSafeEqual.
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      # Engine NOWEB por default (mais leve, ~150MB; estável). O env é
      # WHATSAPP_DEFAULT_ENGINE — WAHA_DEFAULT_ENGINE NÃO existe no WAHA e caía
      # silenciosamente no default WEBJS (browser, trava a sessão).
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # Storage de mídia: Supabase Storage via Backend (NÃO inline base64).
      WAHA_DASHBOARD_ENABLED: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    healthcheck:
      # /ping é o único endpoint sem auth desta build (api/health = 401/404).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Worker 24/7 do agent-engine (fusão Vendaval): fila, cron/follow-up, drain do
  # event_log e turnos do agente rico. Postgres = Supabase (SUPABASE_DB_URL no
  # .env.local). Sobe junto do WAHA: `docker compose up -d`.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: deskcomm-agent-worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.local
    environment:
      # dentro do container, localhost é o próprio worker — o WAHA está na rede
      # do compose (serviço waha, porta interna 3000). Sobrepõe o .env.local.
      WAHA_API_BASE_URL: http://waha:3000
    ports:
      - "8787:8787"
    healthcheck:
      # 127.0.0.1 explícito: localhost resolve p/ ::1 e o healthz escuta só IPv4.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Mantém o worker na rede padrão (WAHA) e adiciona as redes privadas opcionais
    # usadas pelos sidecars Mem0/Graphiti. Os profiles ai-memory/ai-graph continuam
    # desativados por padrão.
    networks:
      - default
      - ai-memory-internal
      - ai-graph-internal

  # Projeção semântica opcional. Nunca inicia com `docker compose up`: exige
  # explicitamente `--profile ai-memory` e só fica acessível pelo loopback no
  # host para o bootstrap local.
  mem0:
    # mem0/mem0-api-server:0.1.117 (o pin anterior) não existe mais no Docker
    # Hub, e a única tag publicada hoje (`latest`) só tem build ARM64 — não
    # roda nativo em x86_64. Build local a partir do source oficial; receita
    # completa e commit pinado em docs/runbooks/mem0.md.
    image: mem0-api-server:local
    profiles: ["ai-memory"]
    restart: unless-stopped
    environment:
      POSTGRES_HOST: mem0-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:?set MEM0_POSTGRES_PASSWORD in managed runtime secrets}
      JWT_SECRET: ${MEM0_JWT_SECRET:?set MEM0_JWT_SECRET in managed runtime secrets}
      OPENAI_API_KEY: ${MEM0_OPENAI_API_KEY:?set MEM0_OPENAI_API_KEY in managed runtime secrets}
    ports:
      - "127.0.0.1:${MEM0_DEV_PORT:-8888}:8000"
    depends_on:
      mem0-postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    # `ai-memory-internal` alone (`internal: true`) blocks ALL routing off
    # that network, inbound AND outbound — the sidecar could reach
    # mem0-postgres but could never call out to its own configured LLM/
    # embedding provider (OpenAI/Gemini/whatever), confirmed by
    # `httpx.ConnectError: Temporary failure in name resolution` when trying.
    # `default` (the same network `worker` already joins for this same
    # reason) restores outbound egress without publishing any port — no host
    # port is opened by joining a network, only by `ports:` above, which
    # stays loopback-only in dev and absent entirely in prod.
    networks: [default, ai-memory-internal]

  # Banco exclusivo do Mem0; nunca aponta para Supabase nem para o schema CRM.
  mem0-postgres:
    image: pgvector/pgvector:pg16
    profiles: ["ai-memory"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: mem0
      POSTGRES_USER: mem0
      POSTGRES_PASSWORD: ${MEM0_POSTGRES_PASSWORD:?set MEM0_POSTGRES_PASSWORD in managed runtime secrets}
    volumes:
      - mem0-postgres-data:/var/lib/postgresql/data
      - ./docker/mem0/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mem0 -d mem0"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ai-memory-internal]

  # Projeção temporal/relacional opcional (Graphiti + Neo4j, Fase 4). Nunca
  # inicia com `docker compose up`: exige `--profile ai-graph` explicitamente.
  # A feature (rollout mode) continua 'off' no CRM até decisão de promoção —
  # subir o sidecar não liga nada por si.
  #
  # HISTÓRICO: a Task 3 original wireou este sidecar em FalkorDB. A Task 4
  # (inspeção ao vivo + leitura do código-fonte empacotado em
  # `zepai/graphiti:0.22.0`) descobriu um defeito de arquitetura: o REST
  # server desta imagem (`graph_service`) só fala com Neo4j —
  # `graph_service/config.py` define `Settings` com os campos obrigatórios
  # `neo4j_uri`/`neo4j_user`/`neo4j_password` e NENHUM campo FalkorDB. Os
  # `FALKORDB_*` que a Task 3 configurava eram silenciosamente ignorados
  # (`extra='ignore'` no Pydantic Settings) e o container `graphiti` entrava
  # em crash-loop por falta das variáveis Neo4j.
  #
  # Decisão explícita do parceiro humano: trocar o sidecar por Neo4j em vez
  # de FalkorDB (Community Edition — grátis, sem serviço pago obrigatório,
  # conforme invariante 9 de self-host). Esta task de correção troca o
  # sidecar e valida ao vivo:
  # - `NEO4J_URI`/`NEO4J_USER`/`NEO4J_PASSWORD` confirmados lendo
  #   `graph_service/config.py` e `zep_graphiti.py` (`Graphiti(uri, user,
  #   password)`) diretamente de dentro da imagem `zepai/graphiti:0.22.0` —
  #   são exatamente os nomes que `Settings` exige (case-insensitive via
  #   pydantic-settings);
  # - `neo4j:5.26.0` confirmado puxável do Docker Hub, Community Edition por
  #   padrão (sem sufixo `-enterprise`, sem aceite de licença exigido);
  # - o par `neo4j` + `graphiti` foi subido ao vivo nesta task com envs dummy
  #   de dev: ambos chegaram a `healthy`, sem crash-loop, e `graphiti`
  #   executou queries Cypher reais contra o Neo4j (confirmado nos logs). O
  #   round-trip completo (`POST /messages` -> `POST /search` encontrando o
  #   fato) NÃO foi provado nesta rodada: `/search` falhou com
  #   `openai.AuthenticationError` (401) porque o `GRAPHITI_LLM_API_KEY` de
  #   teste era intencionalmente falso (nunca uma credencial paga real) — a
  #   falha é do embedder, não da conexão com o Neo4j. Detalhe completo em
  #   `.superpowers/sdd/2026-08-10-ai-platform-phase-4-graphiti/task-3-neo4j-swap-report.md`;
  # - `GRAPHITI_API_KEY` continua sem NENHUM middleware de auth nesta imagem
  #   (achado da Task 4, reconfirmado nesta task) — o isolamento real é a
  #   rede `ai-graph-internal` (`internal: true`), não essa key. Mantida em
  #   `lib/env.ts`/compose só para never-regress se uma versão futura da
  #   imagem adicionar auth; nenhum comentário abaixo afirma que ela
  #   autentica algo hoje.
  #
  # O client TypeScript (`lib/agent-engine/graph/graphiti-client.ts`) fala o
  # contrato HTTP do Graphiti (`/messages`, `/search`, `/group/{id}`,
  # `/healthcheck`), que independe de qual grafo roda atrás dele — o arquivo
  # não tem nenhum código específico de FalkorDB ou Neo4j e não precisou
  # mudar nesta troca.
  neo4j:
    image: neo4j:5.26.0
    profiles: ["ai-graph"]
    restart: unless-stopped
    # Cap duro do container, além do heap/pagecache internos abaixo — pega
    # crescimento de memória fora do JVM heap (ex.: transaction memory,
    # overhead do SO) que os dois envs de memória do Neo4j não cobrem. VPS
    # atual (Hetzner CPX22, 4GB total, compartilhado com app/worker/WAHA)
    # não tem espaço pra um Neo4j sem teto — ver docs/runbooks/graphiti.md
    # "Limite de memória".
    mem_limit: ${GRAPHITI_NEO4J_MEM_LIMIT:-512m}
    environment:
      # Community Edition (tag sem sufixo -enterprise) não exige aceite de
      # licença. `NEO4J_AUTH=neo4j/<senha>` é a forma padrão da imagem
      # oficial de setar a auth inicial — só tem efeito na primeira
      # inicialização do volume de dados (comportamento da própria imagem,
      # não deste compose).
      NEO4J_AUTH: neo4j/${GRAPHITI_NEO4J_PASSWORD:?set GRAPHITI_NEO4J_PASSWORD in managed runtime secrets}
      # Defaults pequenos de propósito (grafo single-tenant, VPS apertada).
      # Sintaxe com "_" duplo é como a imagem oficial mapeia
      # `server.memory.heap.max_size`/`server.memory.pagecache.size` do
      # neo4j.conf pra env var — não é erro de digitação.
      NEO4J_server_memory_heap_max__size: ${GRAPHITI_NEO4J_HEAP_SIZE:-256m}
      NEO4J_server_memory_pagecache_size: ${GRAPHITI_NEO4J_PAGECACHE_SIZE:-128m}
    volumes:
      - neo4j-data:/data
    healthcheck:
      # `/` (porta HTTP 7474) responde 200 com JSON de discovery SEM auth
      # nesta imagem — confirmado ao vivo nesta task. Evita colocar a senha
      # na string do healthcheck (diferente do padrão anterior do FalkorDB,
      # que expunha a senha em texto claro via `docker inspect`).
      test: ["CMD", "wget", "-q", "-O-", "--tries=1", "http://127.0.0.1:7474"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    # SEM `ports:` de propósito: testado ao vivo nesta task e confirmado que
    # Docker NÃO publica porta de host para um container cuja única rede é
    # `internal: true` (`docker port` fica vazio mesmo com `ports:`
    # declarado) — publicar exigiria também juntar `default`, o que daria
    # egress desnecessário a um datastore puro. Pra inspecionar o grafo
    # manualmente em dev, use
    # `docker compose exec neo4j cypher-shell -u neo4j -p "$GRAPHITI_NEO4J_PASSWORD"`
    # (ver docs/runbooks/graphiti.md).
    networks: [ai-graph-internal]

  graphiti:
    image: zepai/graphiti:0.22.0
    profiles: ["ai-graph"]
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${GRAPHITI_NEO4J_PASSWORD:?set GRAPHITI_NEO4J_PASSWORD in managed runtime secrets}
      # Não validado pelo servidor nesta versão da imagem (ver nota acima) —
      # mantido para never-regress quando uma versão com auth for adotada. O
      # app envia o mesmo valor (GRAPHITI_API_KEY em lib/env.ts) em X-Api-Key.
      GRAPHITI_API_KEY: ${GRAPHITI_API_KEY:?set GRAPHITI_API_KEY in managed runtime secrets}
      # Credencial de PLATAFORMA pro LLM/embedder do próprio sidecar Python —
      # nunca a BYOK de um tenant (ai_provider_credentials). Escopo isolado,
      # entregue via Infisical/runtime env conforme doc/runbook.
      OPENAI_API_KEY: ${GRAPHITI_LLM_API_KEY:?set GRAPHITI_LLM_API_KEY in managed runtime secrets}
      # `Settings` desta imagem só conhece o contrato "shape OpenAI"
      # (`openai_api_key`/`openai_base_url`/`model_name`/`embedding_model_name`
      # — sem campo de seleção de provider). Não existe suporte nativo a outro
      # provider, mas qualquer API compatível com o formato REST da OpenAI
      # funciona trocando só a URL — é assim que plugamos o Gemini (endpoint
      # de compatibilidade OpenAI do Google) sem mexer no código do sidecar.
      # Default aponta pra OpenAI real; setar GRAPHITI_LLM_BASE_URL troca de
      # provider. Ver docs/runbooks/graphiti.md "Provider do LLM/embedder".
      OPENAI_BASE_URL: ${GRAPHITI_LLM_BASE_URL:-https://api.openai.com/v1}
      MODEL_NAME: ${GRAPHITI_LLM_MODEL:-gpt-4.1-mini}
      EMBEDDING_MODEL_NAME: ${GRAPHITI_EMBEDDER_MODEL:-text-embedding-3-small}
      # Cada episódio pode disparar várias chamadas de LLM (extração de
      # entidade + resolução de relação). Default baixo pra não estourar rate
      # limit/custo numa instalação self-host pequena. NÃO lido por
      # `zepai/graphiti:0.22.0` (a fila de ingestão desta versão não tem
      # limite de concorrência configurável) — mantido como no-op documentado.
      SEMAPHORE_LIMIT: ${GRAPHITI_INGESTION_CONCURRENCY:-2}
    volumes:
      # Patch local: upstream nunca aplica `embedding_model_name` no
      # embedder (só no llm_client), travando o embedder no modelo default
      # da OpenAI pra qualquer provider. Ver comentário completo no topo de
      # docker/graphiti/zep_graphiti.py e docs/runbooks/graphiti.md "Patch
      # local: embedder ignorado pelo upstream". Revalidar ao trocar a
      # versão da imagem — o conteúdo do arquivo pode mudar de estrutura.
      - ./docker/graphiti/zep_graphiti.py:/app/graph_service/zep_graphiti.py:ro
    depends_on:
      neo4j:
        condition: service_healthy
    # Loopback-only, só pra depuração local do adapter (Task 4). Produção não
    # publica porta nenhuma deste serviço (ver docker-compose.prod.yml).
    ports:
      - "127.0.0.1:${GRAPHITI_DEV_PORT:-8890}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthcheck', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    # ai-graph-internal sozinha (internal: true) bloqueia TODO roteamento pra
    # fora dessa rede, inclusive saída — o sidecar precisa alcançar o provider
    # de LLM/embedder configurado. `default` (a mesma rede que `worker` já usa
    # pelo mesmo motivo) restaura egress sem publicar porta nenhuma extra.
    networks: [default, ai-graph-internal]

volumes:
  waha-data:
  waha-media:
  mem0-postgres-data:
  neo4j-data:

networks:
  ai-memory-internal:
    internal: true
  ai-graph-internal:
    internal: true
