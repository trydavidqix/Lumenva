; Extracted from the real DeskcommCRM production VPS (lumenva-crm), 2026-08-28.
; Test-only PJSIP config for a single softphone extension (1000) used to prove the
; Voice Core SIP/BYOC signaling path end to end. Not a BYOC carrier trunk — that is a
; separate, not-yet-built piece (see docs/handoffs/HANDOFF-voice-sip-2026-08-28.md).
;
; Secrets below are placeholders. Real values live only in the VPS's /etc/asterisk/pjsip.conf
; and must never be committed here.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[1000]
type=endpoint
context=voicecore-test
disallow=all
allow=ulaw
allow=alaw
auth=1000-auth
aors=1000
direct_media=no

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=<REDACTED>

[1000]
type=aor
max_contacts=1
