[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5061

[1000]
type=endpoint
context=voicecore-test
disallow=all
allow=ulaw
allow=alaw
auth=1000-auth
aors=1000
direct_media=no
rtp_symmetric=yes
rewrite_contact=yes
force_rport=yes

[1000-auth]
type=auth
auth_type=userpass
username=1000
password=<REDACTED>

[1000]
type=aor
max_contacts=1
remove_existing=yes
