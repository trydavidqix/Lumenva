; Extracted from the real DeskcommCRM production VPS (lumenva-crm), 2026-08-28.
; Test dialplan: any dialed extension in this context answers and hands the call to the
; ARI Stasis app "voicecore-test", where the Voice SIP worker takes over.
;
; Production dialplan must set SIP_CONNECTION_ID (channel variable) before Stasis(),
; per the Voice Core contract (lib/voice/sip/asterisk-adapter.ts resolves tenant from it).
; This test dialplan does not yet set it — see docs/handoffs/HANDOFF-voice-sip-2026-08-28.md
; "Identidade da conexão" for the pending fix.

[voicecore-test]
exten => _X.,1,NoOp(VoiceCore test call from ${CALLERID(num)})
 same => n,Answer()
 same => n,Stasis(voicecore-test)
 same => n,Hangup()
