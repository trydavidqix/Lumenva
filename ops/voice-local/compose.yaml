services:
  speech:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - voice-local-hf-cache:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  voice-local-hf-cache:
