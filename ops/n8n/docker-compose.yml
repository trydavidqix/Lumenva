# DeskcommCRM — n8n standalone self-host stack (AI Platform Fase 6, Task 5).
#
# OPCIONAL e operacionalmente SEPARADO de docker-compose.prod.yml: não entra
# na cadeia de dependências do core (app/worker/waha/scheduler), sobe e desce
# de forma independente, e usa um PostgreSQL PRÓPRIO — nunca o Postgres/
# Supabase do CRM. Nenhum env de service-role/CRM é passado a este stack; a
# única superfície de contato entre n8n e o CRM é a API pública
# (`/api/mcp`, `/api/v1/webhooks/in/<token>`) autenticada por credenciais
# provisionadas explicitamente (docs/runbooks/n8n-token.md).
#
# Uso:
#   docker compose -f ops/n8n/docker-compose.yml --env-file ops/n8n/.env up -d
#
# `ops/n8n/.env` (NÃO commitado) é copiado de `ops/n8n/.env.example` e
# preenchido com valores reais vindos do cofre operacional gerido
# (docs/runbooks/ai-platform-secrets.md). Detalhe completo de operação,
# exposição pública e segurança: docs/runbooks/n8n.md.
#
# Nenhuma porta é publicada para a internet por padrão — nem o editor nem o
# Postgres dedicado. O bind abaixo é só loopback (127.0.0.1), pensado para um
# proxy reverso do HOST (o mesmo padrão externo usado por WAHA/app em
# produção — ver docs/runbooks/deploy.md e docs/runbooks/n8n.md) alcançar o
# container; não é exposição pública por si só.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  n8n-postgres:
    # Major/tag pinado (não ":latest"). Antes de ir a produção, considere
    # pinar por digest (`docker inspect ... RepoDigests`) seguindo o mesmo
    # cuidado documentado em docs/runbooks/waha-hostgator.md §5.1.
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in managed runtime secrets}
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapa o `$` pro shell DENTRO do container, não pro compose no
      # host (mesmo padrão do `$$INTERNAL_SECRET` em docker-compose.prod.yml)
      # — evita colocar a senha na linha de comando do healthcheck.
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *default-logging
    networks: [n8n-net]

  n8n:
    # Re-verificado contra github.com/n8n-io/n8n/releases em 2026-08-16:
    # tag estável atual `2.34.6` (lançada 2026-08-14). NÃO usar `:latest`/
    # `:stable` em produção — cada upgrade é uma decisão explícita (ver
    # docs/runbooks/n8n.md, seção Update).
    image: n8nio/n8n:2.34.6
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
    environment:
      # --- Banco dedicado (nunca o Postgres/Supabase do CRM) ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in managed runtime secrets}

      # --- Chave de criptografia de credenciais/execuções armazenadas no
      # banco do n8n. Perder esta chave = perder acesso a TODA credencial
      # salva no n8n (irrecuperável). NUNCA regenerar sobre um volume
      # existente sem re-autenticar cada credencial manualmente — ver
      # docs/runbooks/n8n.md antes de gerar ou rotacionar. ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in managed runtime secrets — see docs/runbooks/n8n.md before generating or rotating}

      # --- URL/hostname do editor e dos webhooks. Hostname DEDICADO desta
      # instância n8n — nunca reaproveitar o hostname do WAHA/app. ---
      N8N_HOST: ${N8N_HOST:?set N8N_HOST to the dedicated n8n hostname — never the WAHA/app hostname}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_PORT: "5678"
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:?set N8N_WEBHOOK_URL to https://<dedicated-n8n-host>/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-true}
      # Nº de hops de proxy reverso na frente do n8n (host reverse proxy = 1).
      # Sem isto, cookies seguros/IP de origem ficam incorretos atrás de proxy.
      N8N_PROXY_HOPS: ${N8N_PROXY_HOPS:-1}

      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-America/Sao_Paulo}
      TZ: ${N8N_TIMEZONE:-America/Sao_Paulo}

      # Telemetria/banner desligados por padrão (produto self-host).
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
    volumes:
      # Guarda config local + binary data + (se aplicável) chaves derivadas.
      # As credenciais/execuções em si vivem no n8n-postgres acima.
      - n8n-data:/home/node/.n8n
    ports:
      # Loopback-only: nada além do próprio host alcança esta porta. O host
      # roda o proxy reverso (Nginx/Traefik/Caddy) que decide o que fica
      # público — ver docs/runbooks/n8n.md antes de expor qualquer hostname.
      - "127.0.0.1:${N8N_LOOPBACK_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks: [n8n-net]

volumes:
  n8n-data:
  n8n-postgres-data:

networks:
  # Rede própria deste stack — não compartilhada com docker-compose.prod.yml
  # (nenhum serviço do CRM se conecta aqui, e vice-versa). Não é `internal:
  # true`: o n8n precisa de egress pra chamar o CRM (webhooks/API) e
  # quaisquer serviços externos que os workflows integrarem.
  n8n-net:
    driver: bridge
