# Lumenva Tenancy Safety

## Action

Follow `.claude/rules/multi-tenancy.md` and `.claude/rules/security.md`. Resolve
`organization_id` from a trusted source; service-role queries filter it manually;
backend identity uses `getUser()` rather than `getSession()` as proof.

